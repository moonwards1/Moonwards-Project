<!DOCTYPE html>
<html lang="en-US">
<head>
	<title>Moonwards</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Design your own space economy: the bodies it spans, the skyhooks, space elevators and mass drivers it needs, and the physics behind them.">
	<link rel="icon" type="image/png" href="General_Assets/MoonwardsLogo_26_150px.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Instrument+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;800&amp;display=swap">
	<link rel="stylesheet" href="Shared/calc-shell.css">
	<link rel="stylesheet" href="Home/home.css">
	<!-- ES module; home.js imports its own dependencies. -->
	<script type="module" src="Home/home.js"></script>
</head>
<body>
<div class="hm-page">

	<header class="hm-banner">
		<img class="hm-logo" src="General_Assets/MoonwardsLogo_26_150px.png" alt="" width="100" height="100">
		<div class="hm-banner-t">
			<h1>Moonwards</h1>
			<p>Scientifically grounded designs for a lunar industrial society, and the space economy around it. Pick the worlds, choose the giant infrastructure, and work out what it takes.</p>
		</div>
	</header>

	<section class="hm-vision" id="vision" aria-label="Your space economy">
		<div class="hm-vision-l">
			<div class="hm-vtabs" role="tablist" aria-label="Design">
				<button class="hm-vtab" role="tab" aria-selected="false" disabled title="Coming once the calculators are complete">Moonwards <small>coming later</small></button>
				<button class="hm-vtab" role="tab" aria-selected="true">Make your own</button>
				<div class="hm-strip" id="strip" aria-label="Switch body and installation"></div>
				<span class="hm-hint" id="hint"></span>
				<button class="hm-vtog" id="vtog" type="button" aria-pressed="false" title="Shrink this section to a one-line switcher">Compact</button>
			</div>
			<div class="hm-mx-wrap"><div class="hm-mx" id="matrix"></div></div>
		</div>
		<aside class="hm-facts" id="facts" aria-live="polite"></aside>
	</section>

	<section class="hm-bench" id="bench" aria-label="Workbench">
		<div class="hm-bar">
			<div class="hm-tabs" role="tablist" aria-label="Workbench" id="tabs"></div>
			<div class="hm-act">
				<button class="hm-btn hm-pri" id="btnSave" type="button">Save design</button>
				<button class="hm-btn" id="btnExport" type="button">Export</button>
				<button class="hm-btn" id="btnImport" type="button">Import</button>
			</div>
		</div>
		<div class="hm-work" id="work">
			<div class="hm-empty" id="empty" hidden></div>
		</div>
	</section>

	<section class="hm-apps" id="apps" aria-label="Apps">
		<div class="hm-bar">
			<div class="hm-tabs" role="tablist" aria-label="Apps" id="appTabs"></div>
			<div class="hm-act">
				<button class="hm-btn" id="btnPop" type="button">Pop out</button>
				<a class="hm-btn" href="Calculators/all-calculators.html">All calculators</a>
			</div>
		</div>
		<div class="hm-work hm-app-work" id="appWork" role="tabpanel">
			<div class="hm-empty hm-app-intro" id="appIntro"></div>
		</div>
	</section>

</div>
</body>
</html>
