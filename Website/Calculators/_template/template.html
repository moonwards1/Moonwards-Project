<!DOCTYPE html>
<html lang="en-US">
<head>
	<title>Calculator Template</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="../../Shared/calc-frame.css">
	<link rel="stylesheet" href="template.css">
	<!-- The page script is an ES module; it imports what it needs from
	     ../../Shared/. Serve over http(s) — ES modules do not load from
	     file:// links (run serve.bat at the repo root during development). -->
	<script type="module" src="template.js"></script>
	<script type="module" src="../../Shared/calc-about.js"></script>
</head>
<body class="cf-page">
<div class="cf-calc">
	<h1 class="cf-title">Calculator Template
		<span class="cf-title-info"><button class="cf-info" data-cf-about="about" aria-label="About this calculator">i</button><span class="cf-hint">&larr; click for info</span></span></h1>
	<template id="about" data-title="About this calculator">
		<p>Minimal example wiring the shared utilities together: <code>orbit.js</code>
		(body data), <code>math-utils.js</code> (<code>OrbitalMath</code>),
		<code>format-utils.js</code> (<code>Fmt</code>) and
		<code>ui-components.js</code> (<code>create</code>), laid out with
		<code>calc-frame.css</code>. Copy this folder to
		<code>Calculators/&lt;YourCalc&gt;/</code> to start a new calculator.</p>
	</template>
	<div id="insertItHere"></div>
</div>
</body>
</html>
